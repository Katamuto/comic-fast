[package]
name = "comic-fast"
version = "0.13.0"
description = "Comic Fast: editor de cómics ligero y multiplataforma"
edition = "2021"
rust-version = "1.77"

[lib]
# Nombre distinto del binario para evitar conflictos en Windows.
name = "comic_fast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

# Binario pequeño: toda la lógica está en el frontend, Rust solo abre la ventana.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
