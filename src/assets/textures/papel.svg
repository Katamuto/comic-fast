<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Ejemplo de textura de imagen tileable: ruido con bordes que encajan (stitchTiles). Bórralo cuando quieras. -->
  <filter id="p" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="4" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.25  0 0 0 1.4 -0.45"/>
  </filter>
  <rect width="256" height="256" fill="#f4ecd8"/>
  <rect width="256" height="256" filter="url(#p)" opacity="0.55"/>
</svg>
