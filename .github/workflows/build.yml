# Compila los instaladores de escritorio de Comic Fast (Windows, macOS y Linux) en servidores de
# GitHub y los adjunta a un «Release» en borrador.
#
# Cómo se usa:
#   1) Que la versión coincida en package.json, src-tauri/tauri.conf.json y src-tauri/Cargo.toml.
#   2) Subir una etiqueta:   git tag v0.13.0 && git push origin v0.13.0
#      (o ir a Actions → «Escritorio (instaladores)» → Run workflow, sin etiqueta).
#   3) Al terminar, en Releases aparece el borrador con los instaladores. Revísalo y publícalo.
#      También quedan como «artifacts» de la ejecución (útil si algo falla al crear el release).
#
# Requisito en el repositorio: Settings → Actions → General → Workflow permissions →
# «Read and write permissions» (si no, falla al crear el release con «Resource not accessible»).
name: Escritorio (instaladores)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false # si falla un sistema, los demás siguen
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            rust_targets: aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
            rust_targets: x86_64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            args: --bundles deb,appimage
            rust_targets: ''
          - name: Windows
            platform: windows-latest
            args: --bundles nsis
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Dependencias de Tauri 2 en Linux (la lista oficial para Ubuntu 22.04).
      - name: Dependencias de Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.name }}

      # `npm ci` si hay package-lock.json (instalación exacta); si no, `npm install`.
      - name: Instalar dependencias de Node
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Pruebas
        if: matrix.platform == 'ubuntu-22.04'
        run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # __VERSION__ se sustituye por la versión de tauri.conf.json: debe coincidir con la etiqueta.
          tagName: v__VERSION__
          releaseName: 'Comic Fast v__VERSION__'
          releaseBody: |
            Instaladores de escritorio de Comic Fast.
            - Windows: archivo `.exe` (setup).
            - macOS: `.dmg` (Apple Silicon = aarch64; Intel = x64). La app no está firmada: la primera vez, clic derecho → Abrir.
            - Linux: `.deb` (Debian/Ubuntu) o `.AppImage` (cualquier distribución: dale permiso de ejecución).
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }}
