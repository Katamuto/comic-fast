# Publica la versión web en GitHub Pages cada vez que subes cambios a la rama main.
# Requisito: en el repositorio, Settings → Pages → Source: «GitHub Actions».
name: Web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Cuando subas package-lock.json al repositorio, cambia `npm install` por `npm ci`.
      - run: npm install
      - run: npm test
      - run: npm run build
        env:
          # Opcional: el enlace de donativos va en src/site.config.ts; esto solo lo sustituye.
          VITE_DONATE_URL: ${{ vars.VITE_DONATE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
